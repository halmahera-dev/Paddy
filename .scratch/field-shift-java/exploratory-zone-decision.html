<section id="exploratory-zone-decision" class="card" aria-labelledby="exploratory-zone-title">
  <h2 id="exploratory-zone-title">Exploratory zone</h2>
  <p>Should the demo use a documented public Java zone now, before partner data is available?</p>
  <div class="viz-controls" role="group" aria-label="Choose the exploratory-zone approach">
    <button class="btn btn-primary" type="button" data-choice="public">Use a public zone now</button>
    <button class="btn" type="button" data-choice="wait">Wait for partner data</button>
  </div>
  <p id="exploratory-zone-detail" aria-live="polite">Recommended: use a public zone now. Label every result exploratory. Replace it when the partner data gate passes.</p>
  <button id="exploratory-zone-confirm" class="btn btn-primary" type="button">Choose this approach</button>
</section>
<script>
  (function () {
    const root = document.getElementById("exploratory-zone-decision");
    const detail = document.getElementById("exploratory-zone-detail");
    const confirm = document.getElementById("exploratory-zone-confirm");
    const choices = {
      public: {
        label: "Use a public zone now",
        detail: "Recommended: use a public zone now. Label every result exploratory. Replace it when the partner data gate passes.",
        prompt: "For the exploratory demo, use one documented public Java zone now. Label every result exploratory, then replace it when a partner passes the data gate."
      },
      wait: {
        label: "Wait for partner data",
        detail: "Wait for partner data before choosing a zone. The demonstration cannot run until the data gate passes.",
        prompt: "For the exploratory demo, wait for partner data before choosing a Java zone."
      }
    };
    let selected = "public";

    function restore() {
      const saved = window.openai && window.openai.widgetState && window.openai.widgetState.privateContent;
      if (saved && choices[saved.choice]) selected = saved.choice;
      render();
    }

    function render() {
      const value = choices[selected];
      root.querySelectorAll("[data-choice]").forEach(function (button) {
        const isSelected = button.dataset.choice === selected;
        button.classList.toggle("btn-primary", isSelected);
        button.setAttribute("aria-pressed", String(isSelected));
      });
      detail.textContent = value.detail;
      confirm.textContent = "Choose: " + value.label;
    }

    root.querySelectorAll("[data-choice]").forEach(function (button) {
      button.addEventListener("click", function () {
        selected = button.dataset.choice;
        render();
        if (window.openai && window.openai.setWidgetState) {
          window.openai.setWidgetState({ privateContent: { choice: selected } }).catch(function () {});
        }
      });
    });

    confirm.addEventListener("click", function () {
      const value = choices[selected];
      if (window.openai && window.openai.sendFollowUpMessage) {
        window.openai.sendFollowUpMessage({ prompt: value.prompt, title: "Exploratory zone decision" });
      }
    });

    window.addEventListener("openai:set_globals", function (event) {
      const saved = event.detail && event.detail.globals && event.detail.globals.widgetState;
      if (saved && saved.privateContent && choices[saved.privateContent.choice]) {
        selected = saved.privateContent.choice;
        render();
      }
    });

    restore();
  })();
</script>
